# النشر التلقائي على Cloudflare عند كل push إلى main
# يحتاج سرّين في إعدادات المستودع (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — توكن بصلاحيات: Cloudflare Pages: Edit + Workers Scripts: Edit + D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  — رقم حساب Cloudflare
# بدون السرّين لا يفشل شيء: يظهر تنبيه فقط.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::النشر التلقائي غير مفعّل: أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في Secrets."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Detect changed parts
        if: steps.chk.outputs.ok == 'true'
        id: ch
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            CH="all"
          else
            CH=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          fi
          echo "$CH"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$CH" = "all" ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"; echo "admin=true" >> "$GITHUB_OUTPUT"
          else
            if echo "$CH" | grep -q '^worker/'; then echo "worker=true" >> "$GITHUB_OUTPUT"; else echo "worker=false" >> "$GITHUB_OUTPUT"; fi
            if echo "$CH" | grep -q '^admin-site/'; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Deploy site (bebras-training.pages.dev)
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir -p dist
          cp -r *.html _headers assets data dist/
          npx --yes wrangler@4 pages deploy dist --project-name bebras-training --branch main --commit-dirty=true

      - name: Deploy admin dashboard (bebras-admin.pages.dev)
        if: steps.chk.outputs.ok == 'true' && steps.ch.outputs.admin == 'true'
        run: npx --yes wrangler@4 pages deploy admin-site --project-name bebras-admin --branch main --commit-dirty=true

      - name: Deploy assistant worker (bebras-chat)
        if: steps.chk.outputs.ok == 'true' && steps.ch.outputs.worker == 'true'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
