<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة المشرف | بيبراس تدريب موهبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
:root {
  --bg: #f4f6fb; --surface: #fff; --surface-2: #eef2f8; --text: #1c2433; --muted: #5d6b82; --border: #dde3ee;
  --primary: #1f6feb; --primary-soft: #e3edff; --ok: #12925a; --ok-soft: #e2f6ec; --bad: #d23a3a; --bad-soft: #fdeaea; --warn: #b8700e;
  --radius: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #171e29; --surface-2: #1f2835; --text: #e7ecf3; --muted: #9aa6b8; --border: #2c3747;
    --primary: #5b9bff; --primary-soft: #1b2b45; --ok: #3ccf86; --ok-soft: #14301f; --bad: #ff7070; --bad-soft: #3a1c1c; --warn: #f0b04a; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Tajawal', system-ui, sans-serif; line-height: 1.6; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0 4px; }
header h1 { margin: 0; font-size: 1.35rem; }
header .sp { margin-inline-start: auto; display: flex; gap: 8px; }
button, input, select { font: inherit; }
.btn { border: 1px solid var(--primary); background: var(--primary); color: #fff; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.btn.sec { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn.danger { background: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .6; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.login { max-width: 380px; margin: 12vh auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.login input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: center; direction: ltr; }
.err { color: var(--bad); font-weight: 700; min-height: 1.4em; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
.stat .n { font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: .9rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 10px; }
.tabs button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 16px; font-weight: 700; cursor: pointer; }
.tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters input, .filters select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.filters .count { color: var(--muted); margin-inline-start: auto; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--surface-2); font-weight: 800; position: sticky; top: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
td.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; background: var(--surface-2); }
.pill.t { background: var(--primary-soft); color: var(--primary); }
.pct { font-weight: 800; }
.pct.hi { color: var(--ok); } .pct.mid { color: var(--warn); } .pct.lo { color: var(--bad); }
.ok { color: var(--ok); font-weight: 800; } .no { color: var(--bad); font-weight: 800; }
.muted { color: var(--muted); }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.drawer { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(520px, 100vw); background: var(--surface); border-inline-end: 1px solid var(--border); box-shadow: 0 0 40px rgba(0,0,0,.25); z-index: 10; display: flex; flex-direction: column; }
.drawer[hidden] { display: none; }
.drawer .hd { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.drawer .hd h2 { margin: 0; font-size: 1.2rem; }
.drawer .bd { overflow-y: auto; padding: 12px 16px; flex: 1; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { padding: 8px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 10px; }
.tl .ic { width: 26px; text-align: center; }
.tl .tm { color: var(--muted); font-size: .82rem; }
.note { font-size: .85rem; color: var(--muted); margin-top: 16px; }
.acc { margin-bottom: 14px; }
.acc h3 { margin: 0 0 6px; }
.acc input, .acc select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); min-width: 220px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pwrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pwrow code { font-family: Consolas, monospace; font-size: 1.1rem; background: var(--surface-2); padding: 8px 12px; border-radius: 10px; letter-spacing: .5px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function () {
  const API = 'https://bebras-chat.kdnksa2.workers.dev';
  const KEY = 'bebras-admin-key';
  const app = document.getElementById('app');
  const GR = { m1: 'أول متوسط', m2: 'ثاني متوسط', m3: 'ثالث متوسط' };
  const PAGES = { 'index.html': 'الرئيسية', 'about.html': 'عن المسابقة', 'lessons.html': 'الدروس', 'summaries.html': 'الملخصات', 'bank.html': 'بنك الأسئلة', 'quizzes.html': 'الاختبارات', 'videos.html': 'الفيديوهات', 'chat.html': 'المساعد الذكي' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { timeZone: 'Asia/Riyadh', dateStyle: 'medium', timeStyle: 'short' });
  const when = (ts) => (ts ? fmt.format(new Date(ts)) : '—');
  function ago(ts) {
    if (!ts) return '—';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'الآن';
    if (m < 60) return `قبل ${m} د`;
    const h = Math.round(m / 60);
    if (h < 24) return `قبل ${h} س`;
    return `قبل ${Math.round(h / 24)} يوم`;
  }
  const pctCls = (p) => (p >= 75 ? 'hi' : p >= 50 ? 'mid' : 'lo');
  const mmss = (s) => (s == null ? '—' : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
  const who = (r) => (r.role === 'teacher' ? '<span class="pill t">معلم</span>' : `<span class="pill">${esc(GR[r.grade] || 'طالب')}</span>`);
  // طرق الدخول: كلمة المرور، أو رمز «جهاز المالك» المحفوظ في هذا الجهاز، أو جلسة من زر «لوحة المشرف» في الموقع (#s=…)
  const DEVKEY = 'bebras-owner-device';
  const ls = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* */ } }, del: (k) => { try { localStorage.removeItem(k); } catch (e) { /* */ } } };
  const ss = { get: (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { /* */ } }, del: (k) => { try { sessionStorage.removeItem(k); } catch (e) { /* */ } } };
  const fromLink = (location.hash.match(/[#&]s=(ses_[\w-]+)/) || [])[1];
  if (fromLink) { ss.set(KEY, fromLink); history.replaceState(null, '', location.pathname); }
  let key = ss.get(KEY) || (ss.get('bebras-logged-out') ? null : ls.get(DEVKEY));
  let ME = { role: 'owner' };
  const isOwner = () => ME.role === 'owner';

  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key, ...(opts.headers || {}) } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) {
      if (key && key === ls.get(DEVKEY)) ls.del(DEVKEY); // جهاز حُذف من قائمة الأجهزة
      const m = j.message || 'كلمة المرور غير صحيحة.';
      logout(m); throw new Error(m);
    }
    if (!r.ok) throw new Error(j.message || 'تعذّر الاتصال بالخادم.');
    return j;
  }
  function logout(msg) { key = null; ss.del(KEY); ss.set('bebras-logged-out', '1'); login(typeof msg === 'string' ? msg : ''); }

  function login(msg) {
    const dev = ls.get(DEVKEY);
    app.innerHTML = `<form class="card login" id="lf">
      <div style="font-size:2.4rem">📊</div>
      <h1 style="margin:0;font-size:1.3rem">لوحة المشرف</h1>
      <p class="muted" style="margin:0">بيبراس تدريب موهبة: سجلات الطلاب والمعلمين</p>
      ${dev ? '<button class="btn" type="button" id="devlogin">💻 دخول بهذا الجهاز (بدون كلمة مرور)</button><p class="muted" style="margin:0">أو بكلمة المرور:</p>' : ''}
      <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password" ${dev ? '' : 'required'}>
      <p class="err" id="le">${esc(msg || '')}</p>
      <button class="btn${dev ? ' sec' : ''}" type="submit">دخول</button>
      <p class="muted" style="margin:0;font-size:.85rem">المعلمون الذين منحهم المالك الصلاحية يدخلون من زر «📊 لوحة المشرف» في أعلى الموقع.</p>
    </form>`;
    const f = document.getElementById('lf');
    if (dev) document.getElementById('devlogin').onclick = () => { ss.del('bebras-logged-out'); key = dev; dashboard(); };
    else document.getElementById('pw').focus();
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value.trim();
      if (!pw) { document.getElementById('le').textContent = 'اكتب كلمة المرور.'; return; }
      key = pw;
      const b = f.querySelector('button[type=submit]'); b.disabled = true;
      try { await api('/admin/me'); ss.set(KEY, key); ss.del('bebras-logged-out'); dashboard(); }
      catch (err) { key = null; const le = document.getElementById('le'); if (le) le.textContent = err.message; b.disabled = false; }
    });
  }

  let USERS = [], EXAMS = [], EVENTS = [], TAB = 'people';
  let VIEWERS = new Set();
  async function dashboard() {
    try { ME = await api('/admin/me'); } catch (e) { return; }
    if (!isOwner() && TAB === 'access') TAB = 'people';
    const badge = isOwner() ? `<span class="pill t">👑 المالك${ME.via === 'device' ? ' • من جهاز مسجّل' : ''}</span>` : `<span class="pill">👁️ مشاهدة فقط: ${esc(ME.label || '')}</span>`;
    app.innerHTML = `<header><h1>📊 لوحة المشرف</h1>${badge}
        <span class="sp">${isOwner() ? '<button class="btn sec" id="bk">💾 نسخة احتياطية</button><button class="btn sec" id="bkx">📊 كل السجلات (Excel)</button>' : ''}<button class="btn sec" id="rf">🔄 تحديث</button><button class="btn sec" id="lo">خروج</button></span></header>
      <div id="bk-note"></div>
      <div class="stats" id="stats"><div class="card">جارٍ التحميل…</div></div>
      <div class="tabs" id="tabs">
        <button data-t="people">👥 الأشخاص</button>
        <button data-t="exams">📝 نتائج الاختبارات</button>
        <button data-t="questions">📊 الأسئلة</button>
        <button data-t="activity">🕒 آخر النشاط</button>
        ${isOwner() ? '<button data-t="access">🔐 الصلاحيات</button>' : ''}
      </div>
      <div id="view"></div>
      <aside class="drawer" id="drawer" hidden></aside>
      <p class="note">🔒 البيانات خاصة بالطلاب. لا تشاركها إلا مع المعلمين المعنيين.${isOwner() ? ' يمكنك حذف بيانات أي شخص من صفحته.' : ''}</p>`;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.t === TAB));
    document.getElementById('lo').onclick = logout;
    document.getElementById('rf').onclick = () => { QSTATS = null; load(); };
    if (isOwner()) {
      document.getElementById('bk').onclick = () => backup('json');
      document.getElementById('bkx').onclick = () => backup('csv');
      backupNote();
    }
    document.getElementById('tabs').onclick = (e) => {
      const b = e.target.closest('button'); if (!b) return;
      TAB = b.dataset.t;
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
      render();
    };
    load();
  }

  async function load() {
    try {
      const [s, u, x, ev] = await Promise.all([api('/admin/stats'), api('/admin/users?limit=1000'), api('/admin/exams?limit=1000'), api('/admin/events?limit=300')]);
      USERS = u.users; EXAMS = x.exams; EVENTS = ev.events;
      if (isOwner()) await loadViewers();
      const g = Object.fromEntries((s.by_grade || []).map((r) => [r.grade, r.n]));
      const cards = [
        ['الطلاب', s.students], ['المعلمون', s.teachers], ['نشطون آخر 24 ساعة', s.active_today],
        ['أول متوسط', g.m1 || 0], ['ثاني متوسط', g.m2 || 0], ['ثالث متوسط', g.m3 || 0],
        ['الزيارات', s.visits], ['محاولات التدريب', s.practice], ['اختبارات منجزة', s.exams],
        ['متوسط الاختبارات', s.avg_exam_pct == null ? '—' : s.avg_exam_pct + '%'],
      ];
      document.getElementById('stats').innerHTML = cards.map(([l, n]) => `<div class="card stat"><div class="n">${esc(n ?? 0)}</div><div class="l">${l}</div></div>`).join('');
      render();
    } catch (e) {
      const v = document.getElementById('view'); // قد تكون اللوحة أُغلقت (خروج أو إلغاء صلاحية)
      if (v) v.innerHTML = `<div class="card err">${esc(e.message)}</div>`;
    }
  }

  /* ---------- النسخة الاحتياطية ---------- */
  const BK = 'bebras-last-backup';
  function backupNote() {
    let last = null; try { last = Number(localStorage.getItem(BK)) || null; } catch (e) { /* */ }
    const days = last ? Math.floor((Date.now() - last) / 86400000) : null;
    const el = document.getElementById('bk-note');
    if (!el) return;
    el.innerHTML = days === null || days >= 7
      ? `<div class="card" style="border-color:var(--warn);margin:8px 0">💾 ${days === null ? 'لم تأخذ نسخة احتياطية من هذا الجهاز بعد.' : `آخر نسخة احتياطية قبل ${days} يوم.`} يُنصح بنسخة كل أسبوع: اضغط «نسخة احتياطية» واحفظ الملفين في مكان آمن (ليس في GitHub، لأنه عام).</div>`
      : '';
  }
  // ملف واحد في كل ضغطة (المتصفحات تمنع تنزيل عدة ملفات تلقائيًا مرة واحدة)
  async function backup(kind) {
    const b = document.getElementById(kind === 'json' ? 'bk' : 'bkx');
    const label = b.textContent;
    b.disabled = true; b.textContent = '⏳ جارٍ التجهيز…';
    try {
      const d = await api('/admin/backup');
      const stamp = new Date().toISOString().slice(0, 10);
      if (kind === 'json') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
        a.download = `bebras-backup-${stamp}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        try { localStorage.setItem(BK, String(Date.now())); } catch (e) { /* */ }
        backupNote();
        alert(`تم تنزيل النسخة الاحتياطية الكاملة: ${d.users.length} شخص و${d.events.length} سجل. احفظ الملف في مكان آمن.`);
      } else csv([['المعرّف', 'الاسم', 'الفئة', 'الصف', 'النوع', 'الصفحة', 'المرجع', 'العنوان', 'صحيح؟', 'الدرجة', 'من', 'الوقت (ث)', 'تفاصيل', 'التاريخ'],
        ...d.events.map((e) => { const u = d.users.find((x) => x.id === e.user_id) || {};
          return [e.user_id, u.name, u.role === 'teacher' ? 'معلم' : 'طالب', GR[u.grade] || '', e.type, e.page, e.ref, e.title, e.ok == null ? '' : e.ok ? 'نعم' : 'لا', e.score ?? '', e.total ?? '', e.seconds ?? '', e.detail || '', when(e.ts)]; })], `bebras-records-${stamp}.csv`);
    } catch (e) { alert(e.message); }
    b.disabled = false; b.textContent = label;
  }

  /* ---------- إحصاءات الأسئلة ---------- */
  const SITE = 'https://bebras-training.pages.dev';
  const LV = { m1: 'أول متوسط', m2: 'ثاني متوسط', m3: 'ثالث متوسط', book1: 'كتاب موهبة ١', book2: 'كتاب موهبة ٢' };
  const DF = { easy: 'سهل', medium: 'متوسط', hard: 'صعب' };
  let META = null, QSTATS = null;
  async function loadQuestionStats() {
    if (!META) {
      const get = (p) => fetch(SITE + p).then((r) => { if (!r.ok) throw new Error('تعذّر تحميل الأسئلة من الموقع'); return r.json(); });
      const idx = await get('/data/questions/index.json');
      const [parts, skills] = await Promise.all([Promise.all(idx.files.map((f) => get('/data/questions/' + f))), get('/data/skills.json')]);
      META = { qs: parts.flat(), skills: Object.fromEntries(skills.map((s) => [s.id, s])) };
    }
    if (!QSTATS) QSTATS = await api('/admin/questions');
    const m = (arr) => Object.fromEntries((arr || []).map((r) => [r.qid, r]));
    const pr = m(QSTATS.practice), seen = m(QSTATS.examSeen), wr = m(QSTATS.examWrong);
    return META.qs.map((q) => {
      const p = pr[q.id] || {}, s = (seen[q.id] || {}).n || 0, w = (wr[q.id] || {}).n || 0;
      const tries = (p.attempts || 0) + s, right = (p.correct || 0) + (s - w);
      return { q, pTries: p.attempts || 0, pRight: p.correct || 0, students: p.students || 0, eSeen: s, eRight: s - w, tries, right, pct: tries ? Math.round((100 * right) / tries) : null };
    });
  }

  function csv(rows, name) {
    const s = '﻿' + rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([s], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  async function loadViewers() {
    try { const r = await api('/admin/viewers'); VIEWERS = new Set(r.viewers.map((x) => x.user_id)); return r.viewers; } catch (e) { return []; }
  }

  /* ---------- 🔐 الصلاحيات (للمالك فقط) ---------- */
  async function renderAccess(v) {
    v.innerHTML = '<div class="card">جارٍ التحميل…</div>';
    let devs, viewers;
    try { [devs, viewers] = await Promise.all([api('/admin/devices'), loadViewers()]); } catch (e) { v.innerHTML = `<div class="card err">${esc(e.message)}</div>`; return; }
    if (TAB !== 'access') return;
    const myDev = ls.get(DEVKEY) && devs.current;
    const candidates = USERS.filter((u) => !VIEWERS.has(u.id)).sort((a, b) => (a.role === 'teacher' ? 0 : 1) - (b.role === 'teacher' ? 0 : 1) || a.name.localeCompare(b.name, 'ar'));
    v.innerHTML = `
      <div class="card acc">
        <h3>🔑 كلمة المرور</h3>
        <p class="muted">تظهر هنا للمالك فقط (من يدخل بكلمة المرور أو من جهاز مسجّل). لا تظهر لمن منحتهم صلاحية المشاهدة.</p>
        <div class="pwrow"><code id="pwv" dir="ltr">••••••••••••••••••••</code>
          <button class="btn sec" id="pwshow">👁️ إظهار</button><button class="btn" id="pwcopy">📋 نسخ</button><span class="muted" id="pwmsg"></span></div>
      </div>

      <div class="card acc">
        <h3>💻 أجهزتي (دخول بدون كلمة مرور)</h3>
        <p class="muted">سجّل جهازك ليدخل اللوحة مباشرة كمالك دون كتابة كلمة المرور، ويستطيع رؤية كلمة المرور ونسخها. لا تسجّل إلا أجهزتك الخاصة.</p>
        ${myDev ? '<p class="ok">✓ هذا الجهاز مسجّل كجهاز المالك.</p>' : '<div class="btn-row"><input id="devname" placeholder="اسم الجهاز (مثل: لابتوبي)" maxlength="60"><button class="btn" id="devadd">➕ أضف هذا الجهاز</button></div>'}
        <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>الجهاز</th><th>أُضيف</th><th>آخر استخدام</th><th></th></tr></thead><tbody>${
          devs.devices.length ? devs.devices.map((d) => `<tr><td><strong>${esc(d.label)}</strong>${d.id === devs.current ? ' <span class="pill t">هذا الجهاز</span>' : ''}</td><td class="muted">${esc(when(d.created))}</td><td class="muted">${d.last_used ? ago(d.last_used) : '—'}</td>
            <td><button class="btn sec" data-devdel="${esc(d.id)}">إزالة</button></td></tr>`).join('') : '<tr><td colspan="4" class="empty">لا توجد أجهزة مسجّلة.</td></tr>'}</tbody></table></div>
      </div>

      <div class="card acc">
        <h3>👥 من يدخل اللوحة بدون كلمة مرور (مشاهدة فقط)</h3>
        <p class="muted">اختر شخصًا سجّل في الموقع (مثل معلم). سيظهر له زر <strong>«📊 لوحة المشرف»</strong> في أعلى الموقع <strong>على جهازه الذي سجّل منه</strong>، ويفتح اللوحة مباشرة. يستطيع رؤية الأشخاص والنتائج والإحصاءات فقط: لا يرى كلمة المرور، ولا يحذف، ولا يأخذ نسخة احتياطية، ولا يمنح غيره. الدخول يبقى 12 ساعة ثم يضغط الزر من جديد.</p>
        <div class="btn-row"><select id="vadd"><option value="">اختر شخصًا…</option>${candidates.map((u) => `<option value="${esc(u.id)}">${esc(u.name)} — ${u.role === 'teacher' ? 'معلم' : esc(GR[u.grade] || 'طالب')}</option>`).join('')}</select>
          <button class="btn" id="vgo">🔓 السماح بالدخول</button></div>
        <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>الاسم</th><th>الفئة</th><th>مُنح في</th><th>آخر نشاط</th><th></th></tr></thead><tbody>${
          viewers.length ? viewers.map((x) => `<tr><td><strong>${esc(x.name || '(حُذف)')}</strong></td><td>${who(x)}</td><td class="muted">${esc(when(x.created))}</td><td class="muted">${ago(x.last_seen)}</td>
            <td><button class="btn sec" data-vdel="${esc(x.user_id)}">🔒 إلغاء</button></td></tr>`).join('') : '<tr><td colspan="5" class="empty">لا أحد حتى الآن. اختر شخصًا من القائمة أعلاه.</td></tr>'}</tbody></table></div>
      </div>`;

    let shown = null;
    const getPw = async () => (shown = shown || (await api('/admin/password')).password);
    document.getElementById('pwshow').onclick = async (e) => {
      const el = document.getElementById('pwv');
      if (e.target.dataset.on) { el.textContent = '••••••••••••••••••••'; e.target.textContent = '👁️ إظهار'; delete e.target.dataset.on; return; }
      try { el.textContent = await getPw(); e.target.textContent = '🙈 إخفاء'; e.target.dataset.on = '1'; } catch (err) { alert(err.message); }
    };
    document.getElementById('pwcopy').onclick = async () => {
      const m = document.getElementById('pwmsg');
      try { await navigator.clipboard.writeText(await getPw()); m.textContent = '✓ نُسخت'; } catch (err) { m.textContent = 'تعذّر النسخ، اضغط «إظهار» وانسخها يدويًا.'; }
      setTimeout(() => { m.textContent = ''; }, 3000);
    };
    const add = document.getElementById('devadd');
    if (add) add.onclick = async () => {
      const label = (document.getElementById('devname').value || '').trim() || 'جهازي';
      try { const r = await api('/admin/devices/add', { method: 'POST', body: JSON.stringify({ label }) }); ls.set(DEVKEY, r.token); key = r.token; ss.del(KEY); alert('✓ تم تسجيل هذا الجهاز. من الآن تدخل اللوحة منه بدون كلمة مرور.'); dashboard(); }
      catch (err) { alert(err.message); }
    };
    v.querySelectorAll('[data-devdel]').forEach((b) => b.onclick = async () => {
      const mine = b.dataset.devdel === devs.current;
      if (!confirm(mine ? 'إزالة هذا الجهاز؟ ستحتاج كلمة المرور للدخول منه بعد ذلك.' : 'إزالة هذا الجهاز من الأجهزة المسجّلة؟')) return;
      try { if (mine) { const pw = await getPw(); await api('/admin/devices/remove', { method: 'POST', body: JSON.stringify({ id: b.dataset.devdel }) }); ls.del(DEVKEY); key = pw; ss.set(KEY, pw); }
        else await api('/admin/devices/remove', { method: 'POST', body: JSON.stringify({ id: b.dataset.devdel }) });
        renderAccess(v); } catch (err) { alert(err.message); }
    });
    document.getElementById('vgo').onclick = async () => {
      const id = document.getElementById('vadd').value;
      if (!id) { alert('اختر شخصًا أولًا.'); return; }
      try { await api('/admin/viewers/add', { method: 'POST', body: JSON.stringify({ user_id: id }) }); renderAccess(v); } catch (err) { alert(err.message); }
    };
    v.querySelectorAll('[data-vdel]').forEach((b) => b.onclick = async () => {
      if (!confirm('إلغاء دخول هذا الشخص للوحة؟ سيتوقف فورًا.')) return;
      try { await api('/admin/viewers/remove', { method: 'POST', body: JSON.stringify({ user_id: b.dataset.vdel }) }); renderAccess(v); } catch (err) { alert(err.message); }
    });
  }

  function render() {
    const v = document.getElementById('view');
    if (TAB === 'access') { if (isOwner()) renderAccess(v); return; }
    if (TAB === 'people') {
      v.innerHTML = `<div class="filters">
          <input id="q" placeholder="🔎 ابحث بالاسم">
          <select id="fr"><option value="">الكل</option><option value="student">طلاب</option><option value="teacher">معلمون</option></select>
          <select id="fg"><option value="">كل الصفوف</option><option value="m1">أول متوسط</option><option value="m2">ثاني متوسط</option><option value="m3">ثالث متوسط</option></select>
          <button class="btn sec" id="ex">⬇️ تصدير Excel (CSV)</button><span class="count" id="ct"></span></div>
        <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الفئة</th><th>آخر دخول</th><th>الزيارات</th><th>التدريب (صحيح/الكل)</th><th>الاختبارات</th><th>أفضل نتيجة</th><th>أول دخول</th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const draw = () => {
        const q = document.getElementById('q').value.trim(), r = document.getElementById('fr').value, g = document.getElementById('fg').value;
        const list = USERS.filter((u) => (!q || u.name.includes(q)) && (!r || u.role === r) && (!g || u.grade === g));
        document.getElementById('ct').textContent = `${list.length} شخص`;
        document.getElementById('tb').innerHTML = list.length ? list.map((u) => `<tr class="click" data-id="${esc(u.id)}">
            <td><strong>${esc(u.name)}</strong>${VIEWERS.has(u.id) ? ' <span class="pill t" title="يدخل لوحة المشرف">🔓</span>' : ''}</td><td>${who(u)}</td><td title="${esc(when(u.last_seen))}">${ago(u.last_seen)}</td>
            <td class="num">${u.visits || 0}</td><td class="num">${u.practice_ok || 0} / ${u.practice || 0}</td><td class="num">${u.exams || 0}</td>
            <td>${u.best_exam_pct == null ? '—' : `<span class="pct ${pctCls(u.best_exam_pct)}">${u.best_exam_pct}%</span>`}</td><td class="muted">${esc(when(u.first_seen))}</td></tr>`).join('')
          : '<tr><td colspan="8" class="empty">لا يوجد أحد بعد. عندما يدخل الطلاب الموقع ويكتبون أسماءهم سيظهرون هنا.</td></tr>';
        return list;
      };
      ['q', 'fr', 'fg'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
      document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) person(tr.dataset.id); };
      document.getElementById('ex').onclick = () => {
        const list = draw();
        csv([['الاسم', 'الفئة', 'الصف', 'آخر دخول', 'الزيارات', 'التدريب الصحيح', 'التدريب الكلي', 'الاختبارات', 'أفضل نتيجة %', 'أول دخول'],
          ...list.map((u) => [u.name, u.role === 'teacher' ? 'معلم' : 'طالب', GR[u.grade] || '', when(u.last_seen), u.visits || 0, u.practice_ok || 0, u.practice || 0, u.exams || 0, u.best_exam_pct ?? '', when(u.first_seen)])], 'bebras-people.csv');
      };
      draw();
    } else if (TAB === 'exams') {
      v.innerHTML = `<div class="filters"><select id="fg"><option value="">كل الصفوف</option><option value="m1">أول متوسط</option><option value="m2">ثاني متوسط</option><option value="m3">ثالث متوسط</option><option value="t">المعلمون</option></select>
          <select id="fz"><option value="">كل الاختبارات</option>${[...new Set(EXAMS.map((x) => x.title))].map((t) => `<option>${esc(t)}</option>`).join('')}</select>
          <button class="btn sec" id="ex">⬇️ تصدير Excel (CSV)</button><span class="count" id="ct"></span></div>
        <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>الفئة</th><th>الاختبار</th><th>النتيجة</th><th>النسبة</th><th>الوقت</th><th>لم يُجب</th><th>التاريخ</th></tr></thead><tbody id="tb"></tbody></table></div>`;
      const draw = () => {
        const g = document.getElementById('fg').value, z = document.getElementById('fz').value;
        const list = EXAMS.filter((x) => (!g || (g === 't' ? x.role === 'teacher' : x.grade === g)) && (!z || x.title === z));
        document.getElementById('ct').textContent = `${list.length} نتيجة`;
        document.getElementById('tb').innerHTML = list.length ? list.map((x) => {
          const p = x.total ? Math.round((100 * x.score) / x.total) : 0;
          let d = {}; try { d = JSON.parse(x.detail || '{}'); } catch (e) { /* */ }
          return `<tr class="click" data-id="${esc(x.user_id)}"><td><strong>${esc(x.name)}</strong></td><td>${who(x)}</td><td>${esc(x.title)}</td>
            <td class="num">${x.score} / ${x.total}</td><td><span class="pct ${pctCls(p)}">${p}%</span></td><td class="num">${mmss(x.seconds)}</td>
            <td class="num">${d.unanswered ?? '—'}</td><td class="muted">${esc(when(x.ts))}</td></tr>`;
        }).join('') : '<tr><td colspan="8" class="empty">لا توجد نتائج اختبارات بعد.</td></tr>';
        return list;
      };
      ['fg', 'fz'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
      document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) person(tr.dataset.id); };
      document.getElementById('ex').onclick = () => {
        const list = draw();
        csv([['الاسم', 'الفئة', 'الصف', 'الاختبار', 'الدرجة', 'من', 'النسبة %', 'الوقت (ث)', 'الأسئلة الخاطئة', 'التاريخ'],
          ...list.map((x) => { let d = {}; try { d = JSON.parse(x.detail || '{}'); } catch (e) { /* */ }
            return [x.name, x.role === 'teacher' ? 'معلم' : 'طالب', GR[x.grade] || '', x.title, x.score, x.total, x.total ? Math.round((100 * x.score) / x.total) : '', x.seconds ?? '', (d.wrong || []).join(' '), when(x.ts)]; })], 'bebras-exams.csv');
      };
      draw();
    } else if (TAB === 'questions') {
      v.innerHTML = '<div class="card">جارٍ حساب الإحصاءات…</div>';
      loadQuestionStats().then((rows) => {
        if (TAB !== 'questions') return;
        const bySkill = {};
        rows.forEach((r) => { const k = r.q.skill; bySkill[k] = bySkill[k] || { tries: 0, right: 0 }; bySkill[k].tries += r.tries; bySkill[k].right += r.right; });
        const skillRows = Object.entries(bySkill).filter(([, s]) => s.tries).map(([k, s]) => [k, Math.round((100 * s.right) / s.tries), s.tries]).sort((a, b) => a[1] - b[1]);
        v.innerHTML = `<div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 8px">🧠 المهارات من الأضعف إلى الأقوى</h3>${
          skillRows.length ? skillRows.map(([k, p, n]) => `<div style="display:flex;gap:10px;align-items:center;margin:4px 0"><span style="min-width:220px">${esc((META.skills[k] || {}).icon || '')} ${esc((META.skills[k] || {}).title || k)}</span>
            <span class="pct ${pctCls(p)}" style="min-width:48px">${p}%</span><span class="muted">${n} محاولة</span></div>`).join('')
            : '<p class="muted" style="margin:0">لا توجد محاولات بعد. تظهر الإحصاءات عندما يتحقق الطلاب من إجاباتهم في بنك الأسئلة أو ينهون اختبارًا.</p>'}</div>
          <div class="filters"><select id="fl"><option value="">كل المستويات</option>${Object.entries(LV).map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select>
            <label><input type="checkbox" id="only"> المحاولة فقط</label>
            <button class="btn sec" id="ex">⬇️ تصدير Excel (CSV)</button><span class="count" id="ct"></span></div>
          <div class="tbl-wrap"><table><thead><tr><th>السؤال</th><th>المستوى</th><th>المهارة</th><th>الصعوبة</th><th>محاولات التدريب</th><th>في الاختبارات</th><th>نسبة الصحيح</th></tr></thead><tbody id="tb"></tbody></table></div>
          <p class="note">الأسئلة مرتبة من الأصعب على الطلاب (أقل نسبة صحيح). اضغط على أي سؤال لفتحه في الموقع. إحصاءات الاختبارات تبدأ من 11 نوفمبر 2026.</p>`;
        const draw = () => {
          const lv = document.getElementById('fl').value, only = document.getElementById('only').checked;
          const list = rows.filter((r) => (!lv || r.q.level === lv) && (!only || r.tries)).sort((a, b) => (a.pct ?? 101) - (b.pct ?? 101) || b.tries - a.tries);
          document.getElementById('ct').textContent = `${list.length} سؤال`;
          document.getElementById('tb').innerHTML = list.map((r) => `<tr class="click" data-q="${esc(r.q.id)}"><td><strong>${esc(r.q.title)}</strong></td><td>${esc(LV[r.q.level] || r.q.level)}</td>
            <td>${esc((META.skills[r.q.skill] || {}).title || r.q.skill)}</td><td>${DF[r.q.difficulty] || ''}</td>
            <td class="num">${r.pTries ? `${r.pRight} / ${r.pTries}` : '—'}</td><td class="num">${r.eSeen ? `${r.eRight} / ${r.eSeen}` : '—'}</td>
            <td>${r.pct == null ? '<span class="muted">لا محاولات</span>' : `<span class="pct ${pctCls(r.pct)}">${r.pct}%</span>`}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">لا توجد أسئلة.</td></tr>';
          return list;
        };
        ['fl', 'only'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
        document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-q]'); if (tr) window.open(`${SITE}/bank.html?q=${encodeURIComponent(tr.dataset.q)}`, '_blank', 'noopener'); };
        document.getElementById('ex').onclick = () => {
          const list = draw();
          csv([['السؤال', 'المعرّف', 'المستوى', 'المهارة', 'الصعوبة', 'تدريب صحيح', 'تدريب كلي', 'اختبار صحيح', 'اختبار كلي', 'نسبة الصحيح %'],
            ...list.map((r) => [r.q.title, r.q.id, LV[r.q.level] || r.q.level, (META.skills[r.q.skill] || {}).title || r.q.skill, DF[r.q.difficulty], r.pRight, r.pTries, r.eRight, r.eSeen, r.pct ?? ''])], 'bebras-questions.csv');
        };
        draw();
      }).catch((e) => { v.innerHTML = `<div class="card err">${esc(e.message)}</div>`; });
    } else {
      v.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th></th><th>الاسم</th><th>الفئة</th><th>النشاط</th><th>الوقت</th></tr></thead><tbody id="tb">${
        EVENTS.length ? EVENTS.map((e) => `<tr class="click" data-id="${esc(e.user_id)}"><td>${icon(e)}</td><td><strong>${esc(e.name)}</strong></td><td>${who(e)}</td><td>${desc(e)}</td><td class="muted" title="${esc(when(e.ts))}">${ago(e.ts)}</td></tr>`).join('')
          : '<tr><td colspan="5" class="empty">لا يوجد نشاط بعد.</td></tr>'}</tbody></table></div>`;
      document.getElementById('tb').onclick = (e) => { const tr = e.target.closest('tr[data-id]'); if (tr) person(tr.dataset.id); };
    }
  }

  const icon = (e) => ({ visit: '👁️', practice: e.ok ? '✅' : '❌', exam: '📝' }[e.type] || '•');
  function desc(e) {
    if (e.type === 'visit') return `زار صفحة <strong>${esc(PAGES[e.page] || e.page)}</strong>`;
    if (e.type === 'practice') return `تدريب: ${esc(e.title || e.ref)} <span class="${e.ok ? 'ok' : 'no'}">${e.ok ? 'صحيح' : 'خطأ'}</span>`;
    const p = e.total ? Math.round((100 * e.score) / e.total) : 0;
    return `اختبار: ${esc(e.title || e.ref)}: <span class="pct ${pctCls(p)}">${e.score}/${e.total} (${p}%)</span> <span class="muted">في ${mmss(e.seconds)}</span>`;
  }

  async function person(id) {
    const d = document.getElementById('drawer');
    const u = USERS.find((x) => x.id === id) || {};
    d.hidden = false;
    const granted = VIEWERS.has(id);
    d.innerHTML = `<div class="hd"><div><h2>${esc(u.name || '')}</h2><div>${who(u)} <span class="muted">آخر دخول ${ago(u.last_seen)}</span>${granted ? ' <span class="pill t">🔓 يدخل اللوحة</span>' : ''}</div></div>
      <span style="margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${isOwner() ? `<button class="btn sec" id="grant">${granted ? '🔒 إلغاء دخوله للوحة' : '🔓 السماح له بدخول اللوحة'}</button><button class="btn danger" id="del">حذف بياناته</button>` : ''}
        <button class="btn sec" id="cl">✕</button></span></div>
      <div class="bd"><p class="muted">جارٍ التحميل…</p></div>`;
    document.getElementById('cl').onclick = () => { d.hidden = true; };
    if (isOwner()) {
      document.getElementById('grant').onclick = async () => {
        const msg = granted ? `إلغاء دخول «${u.name}» للوحة المشرف؟ سيتوقف دخوله فورًا.` : `السماح لـ«${u.name}» بدخول لوحة المشرف (مشاهدة فقط) بدون كلمة مرور؟\n\nسيظهر له زر «📊 لوحة المشرف» في أعلى الموقع على جهازه الذي سجّل منه.`;
        if (!confirm(msg)) return;
        try { await api(granted ? '/admin/viewers/remove' : '/admin/viewers/add', { method: 'POST', body: JSON.stringify({ user_id: id }) }); await loadViewers(); person(id); }
        catch (e) { alert(e.message); }
      };
      document.getElementById('del').onclick = async () => {
        if (!confirm(`حذف كل بيانات «${u.name}» نهائيًا؟ لا يمكن التراجع.`)) return;
        try { await api('/admin/delete-user', { method: 'POST', body: JSON.stringify({ id }) }); d.hidden = true; await loadViewers(); load(); }
        catch (e) { alert(e.message); }
      };
    }
    try {
      const { events } = await api('/admin/events?limit=1000&user=' + encodeURIComponent(id));
      const pr = events.filter((e) => e.type === 'practice');
      d.querySelector('.bd').innerHTML = `<p><strong>${events.filter((e) => e.type === 'visit').length}</strong> زيارة •
          تدريب: <strong>${pr.filter((e) => e.ok).length}</strong> صحيح من <strong>${pr.length}</strong> •
          <strong>${events.filter((e) => e.type === 'exam').length}</strong> اختبار</p>
        <ul class="tl">${events.map((e) => `<li><span class="ic">${icon(e)}</span><div>${desc(e)}<div class="tm">${esc(when(e.ts))}</div></div></li>`).join('') || '<li class="muted">لا يوجد نشاط.</li>'}</ul>`;
    } catch (e) { d.querySelector('.bd').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  }

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { const d = document.getElementById('drawer'); if (d) d.hidden = true; } });
  if (key) dashboard(); else login();
})();
</script>
</body>
</html>
