<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملخصات | بيبراس موهبة</title>
<meta name="description" content="ملخص من صفحة واحدة لكل مهارة من مهارات التفكير الحاسوبي، جاهز للطباعة.">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦫</text></svg>">
</head>
<body>
<header id="site-header"></header>
<main class="wrap" id="main"><p class="muted">جارٍ التحميل…</p></main>
<footer id="site-footer"></footer>
<script src="assets/js/core.js"></script>
<script src="assets/js/figures.js"></script>
<script>
(async function () {
  const main = document.getElementById('main');
  const { esc, fmt } = App;

  function sheet(sk, S) {
    return `<article class="sheet">
      <h1><span>${sk.icon}</span> ملخص: ${esc(sk.title)}</h1>
      <h2>📌 التعريف</h2><p>${fmt(S.definition)}</p>
      <h2>💡 الفكرة الأساسية</h2><p>${fmt(S.idea)}</p>
      <div class="cols">
        <div><h2>🧠 حيلة حل الأسئلة</h2><ul>${S.tricks.map((t) => `<li>${fmt(t)}</li>`).join('')}</ul></div>
        <div><h2>⚠️ أخطاء شائعة</h2><ul>${S.mistakes.map((t) => `<li>${fmt(t)}</li>`).join('')}</ul></div>
      </div>
      <h2>✏️ مثال صغير</h2><p>${fmt(S.example.text)}</p>${Fig.render(S.example.figure)}
      <p class="muted print-only" style="font-size:.8rem;margin-top:10px">بيبراس موهبة — موقع تدريبي غير رسمي • bebrasksa.org</p>
    </article>`;
  }

  try {
    const skills = await App.skills();
    const id = App.param('id');
    if (!id) {
      main.innerHTML = `<h1 class="page-title">📝 الملخصات</h1>
        <p class="lead">صفحة A4 واحدة لكل مهارة: التعريف، الفكرة، حيلة الحل، مثال، وأخطاء شائعة. مناسبة للمراجعة السريعة قبل الاختبار.</p>
        <div class="btn-row"><a class="btn secondary" href="summaries.html?id=all">🖨️ عرض وطباعة كل الملخصات</a></div>
        <div class="grid grid-3">${skills.map((s) => `
          <a class="card skill-card" href="summaries.html?id=${s.id}"><span class="ic">${s.icon}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div></a>`).join('')}</div>`;
      return;
    }
    const list = id === 'all' ? skills : skills.filter((s) => s.id === id);
    if (!list.length) { main.innerHTML = '<div class="notice err">الملخص غير موجود. <a href="summaries.html">كل الملخصات</a></div>'; return; }
    const datas = await Promise.all(list.map((s) => App.json(`data/skills/${s.id}.json`)));
    document.title = (id === 'all' ? 'كل الملخصات' : 'ملخص ' + list[0].title) + ' | بيبراس موهبة';
    main.innerHTML = `<div class="btn-row no-print">
        <a class="btn secondary small" href="summaries.html">→ كل الملخصات</a>
        <button class="btn small" type="button" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
        ${id !== 'all' ? `<a class="btn secondary small" href="lessons.html?id=${id}">📘 الدرس الكامل</a>` : ''}
      </div>${list.map((s, i) => sheet(s, datas[i].summary)).join('')}`;
  } catch (e) { App.loadError(main, e); }
})();
</script>
</body>
</html>
