<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الترتيب | بيبراس تدريب موهبة</title>
<meta name="description" content="ترتيب طلاب بيبراس تدريب موهبة حسب النقاط: هذا الأسبوع ومنذ البداية.">
<script>try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/brand/logo-icon.svg">
<link rel="apple-touch-icon" href="assets/brand/logo-180.png">
</head>
<body>
<header id="site-header"></header>
<main class="wrap g-wrap">

  <div class="g-page-h"><h1>🏆 الترتيب</h1>
    <div class="g-tabs" role="group" aria-label="الفترة"><button type="button" data-p="week" aria-pressed="false">هذا الأسبوع</button><button type="button" data-p="all" aria-pressed="true">منذ البداية</button></div></div>
  <p class="muted" style="margin-top:0">النقاط: <strong>10</strong> لكل سؤال مختلف تحلّه صحيحًا في التدريب، و<strong>5</strong> لكل درجة من أفضل نتيجة في كل اختبار. يظهر الاسم الأول والحرف الأول من اسم العائلة فقط.</p>
  <div class="g-card glow" id="me-box" style="margin-bottom:16px"><p class="muted" style="margin:0">جارٍ التحميل…</p></div>
  <div id="board-box"></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/core.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const { esc, game } = App;
  const GR = { m1: 'أول متوسط', m2: 'ثاني متوسط', m3: 'ثالث متوسط' };
  async function load(period) {
    document.querySelectorAll('.g-tabs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.p === period)));
    $('board-box').innerHTML = '<p class="muted">جارٍ التحميل…</p>';
    try {
      const d = await game.board(period);
      const when = period === 'week' ? 'هذا الأسبوع' : 'منذ البداية';
      $('me-box').innerHTML = d.me
        ? `<div class="g-me-bar"><div><div class="muted">مركزك ${when}</div><div class="g-big" style="direction:ltr;text-align:end">#${d.me.r}</div></div><div><div class="muted">نقاطك</div><div class="g-big">${d.me.p.toLocaleString('en')}</div></div><div class="muted">من بين ${d.students.toLocaleString('en')} طالبًا، ${d.ranked.toLocaleString('en')} منهم لديهم نقاط ${when}</div></div>`
        : `<p style="margin:0">لا توجد لك نقاط ${when} بعد. <a href="bank.html">حل أول سؤال</a> لتدخل الترتيب.</p>`;
      $('board-box').innerHTML = d.top.length ? `<table class="g-board"><thead><tr><th>المركز</th><th>الطالب</th><th>الصف</th><th style="text-align:end">النقاط</th></tr></thead><tbody>
        ${d.top.map((x) => `<tr class="${x.me ? 'me' : ''}"><td>${x.r <= 3 ? `<span class="g-medal m${x.r}">${x.r}</span>` : '#' + x.r}</td><td><strong>${esc(x.n)}</strong>${x.me ? ' <span class="g-pill" style="padding:2px 10px">أنت</span>' : ''}</td><td class="muted">${GR[x.g] || ''}</td><td>${x.p.toLocaleString('en')}</td></tr>`).join('')}
        </tbody></table>` : `<div class="g-card"><p style="margin:0">لا يوجد أحد في الترتيب ${when} بعد. كن الأول!</p></div>`;
    } catch (e) {
      $('me-box').innerHTML = '<p style="margin:0">الترتيب غير متاح الآن. تأكد من الاتصال بالإنترنت وحاول لاحقًا.</p>';
      $('board-box').innerHTML = '';
    }
  }
  document.querySelectorAll('.g-tabs button').forEach((b) => b.addEventListener('click', () => load(b.dataset.p)));
  load('all');
})();
</script>
</body>
</html>
